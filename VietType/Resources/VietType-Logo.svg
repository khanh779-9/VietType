<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Mark -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E54"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="85%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#700B2B"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="logoGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Top Highlight Ambient Light -->
    <radialGradient id="logoInnerGlow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="logoBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#FDA4AF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Left Wing of V (White Pearl to Soft Gold) -->
    <linearGradient id="logoLeftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Right Wing of V (Radiant Gold to Vivid Amber) -->
    <linearGradient id="logoRightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Overlap Fold Shadow -->
    <linearGradient id="logoFoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Gradient for "Type" -->
    <linearGradient id="textTypeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Text Gradient for "Viet" -->
    <linearGradient id="textVietGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
  </defs>

  <!-- ==================== LEFT: LOGO ICON MARK ==================== -->
  <g transform="translate(10, 0)">
    <!-- Universal Vector Shadows -->
    <rect x="30" y="38" width="180" height="180" rx="44" ry="44" fill="#4C0519" opacity="0.35"/>
    <rect x="30" y="34" width="180" height="180" rx="44" ry="44" fill="#000000" opacity="0.18"/>

    <!-- Base Squircle -->
    <rect x="30" y="30" width="180" height="180" rx="44" ry="44" fill="url(#logoBgGrad)"/>
    <rect x="30" y="30" width="180" height="180" rx="44" ry="44" fill="url(#logoInnerGlow)"/>
    <rect x="30" y="30" width="180" height="180" rx="44" ry="44" fill="url(#logoGlassGrad)"/>
    <rect x="30.5" y="30.5" width="179" height="179" rx="43.5" ry="43.5" fill="none" stroke="url(#logoBorderGlow)" stroke-width="1.8"/>

    <!-- Scaled Signature 3D Ribbon Glyph "V" -->
    <g transform="translate(30.4, 26.2) scale(0.3515)">
      <!-- Ambient Shadow for V -->
      <g transform="translate(0, 10)" opacity="0.35">
        <path d="M256,388 L386,166 C390,159 385,150 376,150 L318,150 C312,150 306,153 302,159 L238,272 L256,388 Z" fill="#20020A"/>
        <path d="M126,150 C117,150 112,159 116,167 L236,382 C243,394 260,396 269,385 L286,362 L182,159 C178,153 172,150 166,150 Z" fill="#20020A"/>
      </g>
      <!-- Right Wing -->
      <path d="M256,386 L208,310 L308,162 L372,162 Z" fill="#D97706" opacity="0.3"/>
      <path d="M256,388 L386,166 C390,159 385,150 376,150 L318,150 C312,150 306,153 302,159 L238,272 L256,388 Z" fill="url(#logoRightWing)"/>
      <!-- Shadow on Wing -->
      <path d="M242,265 L276,210 L310,270 L256,370 Z" fill="url(#logoFoldShadow)"/>
      <!-- Left Wing -->
      <path d="M126,150 C117,150 112,159 116,167 L236,382 C243,394 260,396 269,385 L286,362 L182,159 C178,153 172,150 166,150 Z" fill="url(#logoLeftWing)"/>
      <!-- Specular Highlight -->
      <path d="M126,152 L170,152 C174,152 178,155 181,159 L283,360 L273,372 L173,165 C170,160 165,157 160,157 L126,157 Z" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>

  <!-- ==================== RIGHT: BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(250, 0)">

    <!-- Main Wordmark: "VietType" -->
    <g transform="translate(0, 118)">
      <!-- "Viet" in Deep Modern Navy -->
      <text x="0" y="0" 
            font-family="'Segoe UI Variable Display', 'Segoe UI', 'Montserrat', 'Inter', -apple-system, sans-serif" 
            font-size="76" 
            font-weight="850" 
            letter-spacing="-1.5"
            fill="url(#textVietGrad)">Viet</text>

      <!-- "Type" in Vibrant Ruby-Rose Gradient -->
      <text x="178" y="0" 
            font-family="'Segoe UI Variable Display', 'Segoe UI', 'Montserrat', 'Inter', -apple-system, sans-serif" 
            font-size="76" 
            font-weight="850" 
            letter-spacing="-1.5"
            fill="url(#textTypeGrad)">Type</text>

      <!-- Sleek Typing Cursor / Caret Accent -->
      <rect x="368" y="-62" width="5" height="66" rx="2.5" fill="#E11D48">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>

      <!-- Mini Version / Technology Pill Badge -->
      <g transform="translate(390, -56)">
        <rect x="0" y="0" width="68" height="24" rx="6" fill="url(#badgeGrad)" stroke="#FDA4AF" stroke-width="1"/>
        <text x="34" y="16" 
              font-family="'Segoe UI', sans-serif" 
              font-size="11" 
              font-weight="700" 
              fill="#BE123C" 
              text-anchor="middle">v1.0 x64</text>
      </g>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="3" y="152" 
          font-family="'Segoe UI Variable Text', 'Segoe UI', 'Inter', sans-serif" 
          font-size="16.5" 
          font-weight="600" 
          letter-spacing="3.2" 
          fill="#64748B">BỘ GÕ TIẾNG VIỆT HIỆN ĐẠI</text>

    <!-- Bottom Feature Pills / Highlights -->
    <g transform="translate(3, 172)">
      <!-- Pill 1: Engine -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="12" cy="13" r="3.5" fill="#10B981"/>
        <text x="76" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Telex • VNI • VIQR</text>
      </g>

      <!-- Pill 2: 17 Code Tables -->
      <g transform="translate(146, 0)">
        <rect x="0" y="0" width="112" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="12" cy="13" r="3.5" fill="#3B82F6"/>
        <text x="63" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">17 Bảng mã</text>
      </g>

      <!-- Pill 3: Super Fast -->
      <g transform="translate(266, 0)">
        <rect x="0" y="0" width="128" height="26" rx="13" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="12" cy="13" r="3.5" fill="#E11D48"/>
        <text x="71" y="17" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Siêu nhẹ • Chuẩn xác</text>
      </g>
    </g>

  </g>
</svg>
